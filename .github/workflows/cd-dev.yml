name: CD DEV

on:
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Sign in Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build -f ./Dockerfile --platform linux/amd64 --no-cache -t dongbaeb0/dongbaeb:dev .

      - name: Push the Docker Image to Dockerhub
        run: docker push dongbaeb0/dongbaeb:dev

  deploy:
    needs: build
    runs-on: [ self-hosted, dev ]

    steps:
      - name: Docker Image pull
        run: sudo docker pull dongbaeb0/dongbaeb:dev

      - name: Stop existing container
        run: sudo docker rm -f dongbaeb-dev-server

      - name: Docker Image prune
        run: sudo docker image prune -f -a

      - name: pull docker compose yaml files
        working-directory: /home/ubuntu
        run: |
          [ -d dong-baeb-back ] || git clone --filter=blob:none --no-checkout https://github.com/dong-baeb/dong-baeb-back.git
          cd dong-baeb-back
          git sparse-checkout init --cone
          git fetch origin feature/#44
          git checkout feature/#44
          git sparse-checkout set docker
          git pull origin feature/#44

      - name: Docker run
        working-directory: /home/ubuntu
        env:
          JWT_TOKEN_SECRET_KEY: ${{ secrets.JWT_TOKEN_SECRET_KEY }}
          DEV_MYSQL_URL: ${{ secrets.DEV_MYSQL_URL }}
          DEV_MYSQL_USER_NAME: ${{ secrets.DEV_MYSQL_USER_NAME }}
          DEV_MYSQL_PASSWORD: ${{ secrets.DEV_MYSQL_PASSWORD }}
        run: |
          cd dong-baeb-back/docker/dev
          sudo -E docker compose -f docker-dev.yml up -d
