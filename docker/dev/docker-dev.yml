services:
  dongbaeb-dev-server:
    image: dongbaeb0/dongbaeb:dev
    container_name: dongbaeb-dev-server
    restart: on-failure:3
    ports:
      - "80:8080"
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev
      JWT_TOKEN_SECRET_KEY: ${JWT_TOKEN_SECRET_KEY}
      DEV_MYSQL_URL: ${DEV_MYSQL_URL}
      DEV_MYSQL_USER_NAME: ${DEV_MYSQL_USER_NAME}
      DEV_MYSQL_PASSWORD: ${DEV_MYSQL_PASSWORD}

  dongbaeb-mysql-dev:
    image: mysql:8.4.5
    container_name: dongbaeb-mysql-dev
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-init:/docker-entrypoint-initdb.d
    expose:
      - "3306"
    restart: always
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_PASSWORD}
      MYSQL_DATABASE: dongbaeb_dev
      LANG: C.UTF-8
      MYSQL_INIT_CONNECT: "SET NAMES utf8mb4"

volumes:
  mysql-data:
  mysql-init:
